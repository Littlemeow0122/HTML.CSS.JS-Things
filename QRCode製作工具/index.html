<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QRCode 產生器</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8711/8711968.png" />
</head>
<body>

  <div class="container">
    <h2>QRCode 產生器</h2>

    <div class="form-group">
      <label>輸入內容：</label>
      <input type="text" id="data" value="https://example.com">
    </div>

    <div class="form-group">
      <label>前景顏色：</label>
      <input type="color" id="fg-color" value="#000000">
    </div>

    <div class="form-group">
      <label>背景顏色：</label>
      <input type="color" id="bg-color" value="#ffffff">
    </div>

    <div class="form-group">
      <label>上傳中央圖示：</label>
      <input type="file" id="logo" accept="image/*">
    </div>

    <div class="form-group">
      <label>馬眼樣式：</label>
      <select id="corner-style">
        <option value="square">方形</option>
        <option value="dot">圓點</option>
        <option value="extra-rounded">超圓角</option>
      </select>
    </div>

    <div class="form-group">
      <label>錯誤容忍率：</label>
      <select id="error-correction">
        <option value="L">L</option>
        <option value="M">M</option>
        <option value="Q">Q</option>
        <option value="H" selected>H</option>
      </select>
    </div>

    <div class="form-group">
      <label>尺寸 (px)：</label>
      <input type="number" id="size" value="300" min="100" max="1000">
    </div>

    <div class="form-group">
      <label>背景樣式：</label>
      <select id="gradient-switch">
        <option value="off">單色</option>
        <option value="horizontal">水平漸層</option>
        <option value="vertical">垂直漸層</option>
      </select>
    </div>

    <div id="gradient-options" class="hidden">
      <div class="form-group">
        <label>漸層起始顏色：</label>
        <input type="color" id="gradient-start" value="#ffffff">
      </div>

      <div class="form-group">
        <label>漸層結束顏色：</label>
        <input type="color" id="gradient-end" value="#cccccc">
      </div>
    </div>

    <button onclick="generateQRCode()">產生 QRCode</button>
    <button onclick="downloadQRCode()">下載 QRCode</button>

    <div id="qr"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
